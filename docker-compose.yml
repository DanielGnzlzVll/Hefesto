version: '3.7'

services:
  postgres:
    container_name: postgres_container
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hefestodb
      POSTGRES_USER: hefesto
      POSTGRES_PASSWORD: ${HEFESTO_DB_PASSWORD:?HEFESTO_DB_PASSWORD must be set in .env}
    networks:
      - postgres
    restart: always
    volumes:
      - pgdata18:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 50M

  grafana:
    container_name: grafana_container
    image: grafana/grafana:6.6.0-ubuntu
    user: root
    networks:
      - postgres
      - nginx_proxy
    links:
      - postgres
    restart: always
    volumes:
      # la z (minuscula) permite el acceso a archivo protegidos por SELinux
      - ./grafana/provisioning:/usr/share/grafana/provisioning:z
      - grafana_data:/var/lib/grafana
    environment: 
      - GF_INSTALL_PLUGINS=natel-discrete-panel
      # - GF_PATHS_CONFIG:/usr/grafana/custom.ini
      - GF_PATHS_PROVISIONING=/usr/share/grafana/provisioning
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - HEFESTO_DB_PASSWORD=${HEFESTO_DB_PASSWORD:?HEFESTO_DB_PASSWORD must be set in .env}
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 50M
    
  # container para ejecutar migraciones Django
  migrate:
    build: ./App
    image: hefesto
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate"
    environment:
      HEFESTO_DB_PASSWORD: ${HEFESTO_DB_PASSWORD:?HEFESTO_DB_PASSWORD must be set in .env}
      DJANGO_STATIC_ROOT: /var/www/hefesto/static
    networks:
      - postgres
    links:
      - postgres
    depends_on:
      - postgres
    volumes:
      - ./App:/usr/src/hefesto:z
      - static:/var/www/hefesto/static
    deploy:
      resources:
        limits:
          memory: 200M

  webapp:
    container_name: hefesto_web_app
    image: hefesto
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4
    environment:
      HEFESTO_DB_PASSWORD: ${HEFESTO_DB_PASSWORD:?HEFESTO_DB_PASSWORD must be set in .env}
      DJANGO_ALLOWED_HOSTS:
    networks:
      - nginx_proxy
      - postgres
    links:
      - postgres
    depends_on:
      - postgres
      - grafana
      - migrate
    restart: always
    volumes:
      - /etc/wpa_supplicant:/etc/wpa_supplicant:z
      - ./App:/usr/src/hefesto:z
    privileged: true
    deploy:
      resources:
        limits:
          memory: 100M

  processor:
    container_name: hefesto_processor
    image: hefesto
    entrypoint: bash -c "python manage.py hefesto_processor"
    environment:
      HEFESTO_DB_PASSWORD: ${HEFESTO_DB_PASSWORD:?HEFESTO_DB_PASSWORD must be set in .env}
    networks:
      - postgres
    links:
      - postgres
    depends_on:
      - postgres
      - webapp
    restart: always
    volumes:
      - ./App:/usr/src/hefesto:z
    privileged: true
    deploy:
      resources:
        limits:
          memory: 300M
  
  web:
    container_name: nginx_proxy
    image: nginx:alpine
    volumes:
      # la z (minuscula) permite el acceso a archivo protegidos por SELinux
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:z
      - static:/var/www/hefesto/static:ro
    networks:
      - nginx_proxy
    links:
      - grafana
      - webapp
    ports:
      - "80:80"
    depends_on:
      - grafana
      - webapp
    restart: always
    deploy:
      resources:
        limits:
          memory: 50M

networks:
  postgres:
  nginx_proxy:
    
volumes:
  grafana_data:
  hefesto:
  pgdata18:
  static:

